<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Numerki LIVE</title>
</head>

<body style="text-align:center; font-size:50px;">

<h1 id="num">--</h1>

<input id="inp" type="number" placeholder="Wpisz numer">
<button onclick="send()">Wyślij</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnTqYWvdHDnTdtbkcjmRLywbNj2oQIemI",
  authDomain: "numerki-cdcf9.firebaseapp.com",
  databaseURL: "https://numerki-cdcf9-default-rtdb.firebaseio.com/",
  projectId: "numerki-cdcf9",
  storageBucket: "numerki-cdcf9.firebasestorage.app",
  messagingSenderId: "142380598524",
  appId: "1:142380598524:web:4a2b68a278106ae12ac379"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 📤 wysyłanie numeru
window.send = function() {
  const num = document.getElementById("inp").value;
  set(ref(db, "number"), num);
};

// 📺 odbieranie numeru
onValue(ref(db, "number"), (snapshot) => {
  const val = snapshot.val();
  document.getElementById("num").innerText = val;

  if (val) {
    const msg = new SpeechSynthesisUtterance("Numerek " + val);
    msg.lang = "pl-PL";
    speechSynthesis.speak(msg);
  }
});
</script>

</body>
</html>
